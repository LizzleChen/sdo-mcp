[project]
name = "sdo-mcp"
version = "0.1.0"
description = "MCP server for state demography office population, household, and employment forecasts"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
]

[dependency-groups]
# Ingest-time only — the serve path stays stdlib (sqlite3).
ingest = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8",
    {include-group = "ingest"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
