[project]
name = "sdo-mcp"
version = "0.1.0"
description = "MCP server for state demography office population, household, and employment forecasts"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1,<3",
]

[project.scripts]
sdo-mcp = "sdo_mcp.server:main"
sdo-mcp-install-data = "sdo_mcp.install:main"

[dependency-groups]
# Ingest-time only — the serve path stays stdlib (sqlite3).
ingest = [
    "cloudscraper>=1.2.71",
    "openpyxl>=3.1",
    "pypdf>=6",
]
dev = [
    "pytest>=8",
    {include-group = "ingest"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
